substitutions:
  name: ikabot-xvf3800
  friendly_name: Ikabot XVF3800
  # Pin the formatBCE hardware/C++/DSP side to the upstream revision reviewed
  # while this integration was prepared.
  respeaker_ref: e9b11374c7bd9d3ba95ce084dfd30860eb7e4bc7
  log_level: INFO

packages:
  ikabot_xvf:
    url: https://github.com/guillaumebianchin84/Respeakerikabot-XVF3800-ESPHome-integration
    ref: ikabot-integration
    refresh: 0s
    files:
      - packages/base.yaml
      - packages/hardware.yaml
      - packages/ikabot-voice-assistant.yaml
      - packages/ikabot-diagnostics.yaml
      - packages/leds.yaml
      - packages/timers-alarm.yaml

# The proxy player is an Ikabot-specific component. It makes ESPHome believe
# that the XVF owns a media player while the actual audio is played by the
# ReSpeaker Lite. This is required to preserve native continue_conversation.
external_components:
  - source:
      type: git
      url: https://github.com/guillaumebianchin84/Respeakerikabot-XVF3800-ESPHome-integration
      ref: ikabot-integration
    components:
      - ikabot_proxy_media_player
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret ikabot_xvf_api_encryption_key

ota:
  - platform: esphome
    id: ota_esphome
    encryption:

# Initial recommendation: enable Beam Lock from Home Assistant after the first
# basic microphone test. Keeping it user-switchable makes A/B testing easy.
