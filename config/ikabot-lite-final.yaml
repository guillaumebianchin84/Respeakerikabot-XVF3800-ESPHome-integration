substitutions:
  wake_word_triggered_sound_file: "/config/esphome/sounds/activation/01_oui.mp3"


# ============================================================
# PACKAGE RESPEAKER LITE LOCAL MODIFIÉ
# ============================================================

packages:
  respeaker-satellite: !include packages/ikabot/respeaker-satellite-base.yaml

  ikabot-audio-node:
    url: https://github.com/guillaumebianchin84/Respeakerikabot-XVF3800-ESPHome-integration
    ref: ikabot-integration
    refresh: 0s
    files:
      - packages/ikabot-lite-audio-node.yaml


# ============================================================
# IKABOT
# ============================================================

esphome:
  name: ikabot
  friendly_name: ikabot

  on_boot:
    priority: -100
    then:
      - delay: 2s

      - lambda: |-
          id(ikabot_mic_stt_0).set_gain_factor(
            id(ikabot_gain_stt_0).state
          );

          id(ikabot_mic_stt_1).set_gain_factor(
            id(ikabot_gain_stt_1).state
          );

          id(ikabot_mic_wake).set_gain_factor(
            id(ikabot_gain_wake).state
          );

          id(va).set_noise_suppression_level(
            (uint8_t) id(ikabot_noise_suppression).state
          );

          id(va).set_auto_gain(
            (uint8_t) id(ikabot_auto_gain).state
          );

          id(va).set_volume_multiplier(
            id(ikabot_volume_multiplier).state
          );

      # Vérifie après chaque démarrage si un crash précédent
      # a laissé la Freebox / Google Home avec le volume baissé.
      - script.execute: recuperer_volume_apres_reboot


# ============================================================
# WIFI
# ============================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


# ============================================================
# HOME ASSISTANT API
# ============================================================

api:
  encryption:
    key: !secret ikabot_api_encryption_key


# ============================================================
# OTA
# ============================================================

ota:
  - platform: esphome
    password: !secret ikabot_ota_password


# ============================================================
# VARIABLES INTERNES IKABOT
# ============================================================

globals:

  - id: ikabot_ok_action
    type: bool
    restore_value: no
    initial_value: 'false'

  # ----------------------------------------------------------
  # TRANSCRIPTION INCOMPRÉHENSIBLE
  # ----------------------------------------------------------

  - id: ikabot_incomprehensible
    type: bool
    restore_value: no
    initial_value: 'false'


  # ----------------------------------------------------------
  # DIAGNOSTIC - COMPTEUR DE TRACE
  # ----------------------------------------------------------

  - id: ikabot_trace_num
    type: uint32_t
    restore_value: no
    initial_value: '0'


  # ----------------------------------------------------------
  # DIAGNOSTIC - LATENCES PIPELINE
  #
  # Aucun publish Home Assistant pendant STT / Conversation.
  # On mémorise uniquement millis() localement.
  # ----------------------------------------------------------

  - id: diag_pipeline_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: diag_listening_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: diag_vad_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: diag_vad_end_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: diag_stt_end_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: diag_intent_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: diag_intent_end_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: diag_tts_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: diag_tts_end_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'


