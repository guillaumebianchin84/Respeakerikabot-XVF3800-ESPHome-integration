# ============================================================
# WAKE WORD
# ============================================================

micro_wake_word:

  microphone:
    id: ikabot_mic_wake
    microphone: i2s_mics
    channels: 1
    gain_factor: 1

  on_wake_word_detected:

    - lambda: |-
        id(ikabot_dernier_wake_word).publish_state(wake_word);

        auto now = id(homeassistant_time).now();

        id(ikabot_trace_num)++;

        std::string trace =
          std::string("#") +
          std::to_string(id(ikabot_trace_num)) +
          std::string(" ");

        if (now.is_valid()) {
          id(ikabot_dernier_wake_word_heure).publish_state(
            now.strftime("%d/%m/%Y %H:%M:%S")
          );

          trace += now.strftime("%H:%M:%S");
          trace += std::string(" - WAKE - ");
          trace += wake_word;
        } else {
          trace += std::string("WAKE - ");
          trace += wake_word;
        }

        id(ikabot_trace).publish_state(trace);


    - if:
        condition:
          lambda: |-
            return (
              wake_word == "Stop" ||
              wake_word == "stop" ||
              wake_word == "STOP"
            );

        then:
          - logger.log:
              level: INFO
              format: "IKABOT : wake word STOP -> restauration volume"

          - script.execute:
              id: ikabot_trace_event
              evenement: "STOP -> RESTAURATION VOLUME"

          - homeassistant.action:
              action: script.ikabot_restaure_volume_freebox


# ============================================================
# SCRIPTS IKABOT
# ============================================================

script:

  - id: recuperer_volume_apres_reboot
    mode: restart

    then:
      - logger.log:
          level: DEBUG
          format: "IKABOT BOOT : attente connexion Home Assistant"

      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 60s

      - if:
          condition:
            api.connected:
              state_subscription_only: true

          then:
            - logger.log:
                level: DEBUG
                format: "IKABOT BOOT : Home Assistant connecte"

            - wait_until:
                condition:
                  lambda: |-
                    return id(ikabot_volume_temporairement_baisse).has_state();
                timeout: 15s

            - if:
                condition:
                  lambda: |-
                    return
                      id(ikabot_volume_temporairement_baisse).has_state() &&
                      id(ikabot_volume_temporairement_baisse).state;

                then:
                  - logger.log:
                      level: WARN
                      format: "IKABOT BOOT : volume reste baisse -> restauration"

                  - script.execute:
                      id: ikabot_trace_event
                      evenement: "BOOT -> RESTAURATION VOLUME"

                  - homeassistant.action:
                      action: script.ikabot_restaure_volume_freebox

                else:
                  - logger.log:
                      level: DEBUG
                      format: "IKABOT BOOT : aucune restauration necessaire"

          else:
            - logger.log:
                level: WARN
                format: "IKABOT BOOT : Home Assistant non connecte apres 60s"


  - id: ikabot_trace_event
    mode: queued

    parameters:
      evenement: string

    then:
      - lambda: |-
          auto now = id(homeassistant_time).now();

          id(ikabot_trace_num)++;

          std::string trace =
            std::string("#") +
            std::to_string(id(ikabot_trace_num)) +
            std::string(" ");

          if (now.is_valid()) {
            trace += now.strftime("%H:%M:%S");
            trace += std::string(" - ");
          }

          trace += evenement;

          id(ikabot_trace).publish_state(trace);


  - id: limite_ecoute
    mode: restart

    then:
      - delay: 10s

      - if:
          condition:
            lambda: |-
              return id(ikabot_etat).state == "Écoute";

          then:
            - logger.log:
                level: WARN
                format: "IKABOT : limite écoute 10s atteinte -> arrêt"

            - script.execute:
                id: ikabot_trace_event
                evenement: "ECOUTE TIMEOUT 10s"

            - voice_assistant.stop:


  - id: keep_playback_timeout_cancelled
    mode: restart

    then:
      - repeat:
          count: 120

          then:
            - lambda: |-
                auto s = id(external_media_player).state;

                if (
                  s == media_player::MEDIA_PLAYER_STATE_ANNOUNCING ||
                  s == media_player::MEDIA_PLAYER_STATE_PLAYING
                ) {
                  return;
                }

                App.scheduler.cancel_timeout(id(va), "playing");

            - delay: 500ms


  - id: voice_assistant_watchdog
    mode: restart

    then:
      - logger.log:
          level: DEBUG
          format: "IKABOT WATCHDOG : arme"

      - repeat:
          count: 40

          then:
            - if:
                condition:
                  lambda: |-
                    auto s = id(external_media_player).state;

                    return (
                      s == media_player::MEDIA_PLAYER_STATE_ANNOUNCING ||
                      s == media_player::MEDIA_PLAYER_STATE_PLAYING
                    );

                then:
                  - logger.log:
                      level: DEBUG
                      format: "IKABOT WATCHDOG : audio demarre - annulation"

                  - script.stop: voice_assistant_watchdog

            - delay: 500ms

      - if:
          condition:
            voice_assistant.is_running

          then:
            - logger.log:
                level: WARN
                format: "IKABOT WATCHDOG : aucun audio apres 20s - arret force"

            - script.execute:
                id: ikabot_trace_event
                evenement: "WATCHDOG ARRET - PAS AUDIO 20s"

            - voice_assistant.stop:

            - homeassistant.action:
                action: script.ikabot_restaure_volume_freebox


  - id: restaurer_freebox_apres_reponse
    mode: restart

    then:
      - logger.log:
          level: DEBUG
          format: "IKABOT FREEBOX : attente debut TTS"

      - wait_until:
          condition:
            media_player.is_announcing:
              id: external_media_player
          timeout: 20s

      - if:
          condition:
            media_player.is_announcing:
              id: external_media_player

          then:
            - logger.log:
                level: DEBUG
                format: "IKABOT FREEBOX : TTS demarre"

            - script.execute:
                id: ikabot_trace_event
                evenement: "TTS AUDIO DEBUT"

            - wait_until:
                condition:
                  not:
                    media_player.is_announcing:
                      id: external_media_player
                timeout: 60s

            - logger.log:
                level: DEBUG
                format: "IKABOT FREEBOX : TTS termine - verification continuation"

            - script.execute:
                id: ikabot_trace_event
                evenement: "TTS AUDIO FIN"

            - delay: 1s

            - if:
                condition:
                  voice_assistant.is_running

                then:
                  - logger.log:
                      level: DEBUG
                      format: "IKABOT FREEBOX : conversation continue - volume reste baisse"

                  - script.execute:
                      id: ikabot_trace_event
                      evenement: "CONVERSATION CONTINUE"

                else:
                  - logger.log:
                      level: WARN
                      format: "IKABOT FREEBOX : conversation terminee -> restauration volume"

                  - script.execute:
                      id: ikabot_trace_event
                      evenement: "CONVERSATION TERMINEE"

                  - homeassistant.action:
                      action: script.ikabot_restaure_volume_freebox

          else:
            - logger.log:
                level: WARN
                format: "IKABOT FREEBOX : TTS non demarre apres 20s -> restauration securite"

            - script.execute:
                id: ikabot_trace_event
                evenement: "TTS NON DEMARRE 20s"

            - homeassistant.action:
                action: script.ikabot_restaure_volume_freebox


  - id: jouer_son_attente
    mode: restart

    then:
      - lambda: |-
          const char* sounds[] = {
            "attente_01",
            "attente_02",
            "attente_03",
            "attente_04",
            "attente_05",
            "attente_06",
            "attente_07",
            "attente_08",
            "attente_09",
            "attente_10",
            "attente_11",
            "attente_12",
            "attente_13",
            "attente_14",
            "attente_15",
            "attente_16",
            "attente_17",
            "attente_18",
            "attente_19",
            "attente_20"
          };

          uint32_t index = random_uint32() % 20;

          id(external_media_player)
            ->make_call()
            .set_media_url(std::string("audio-file://") + sounds[index])
            .set_announcement(true)
            .perform();


# ============================================================
# VOICE ASSISTANT
# ============================================================

voice_assistant:

  microphone:

    - id: ikabot_mic_stt_0
      microphone: i2s_mics
      channels: 0
      gain_factor: 1

    - id: ikabot_mic_stt_1
      microphone: i2s_mics
      channels: 1
      gain_factor: 1

  noise_suppression_level: 0
  auto_gain: 0dBFS
  volume_multiplier: 1.2


  # ----------------------------------------------------------
  # DÉMARRAGE
  # ----------------------------------------------------------

  on_start:

    - script.stop: limite_ecoute

    - lambda: |-
        id(ikabot_ok_action) = false;
        id(ikabot_incomprehensible) = false;

        // Nouveau pipeline : remise à zéro des chronos.
        id(diag_pipeline_start_ms) = millis();
        id(diag_listening_ms) = 0;
        id(diag_vad_start_ms) = 0;
        id(diag_vad_end_ms) = 0;
        id(diag_stt_end_ms) = 0;
        id(diag_intent_start_ms) = 0;
        id(diag_intent_end_ms) = 0;
        id(diag_tts_start_ms) = 0;
        id(diag_tts_end_ms) = 0;

    - lambda: |-
        id(ikabot_mic_stt_0).set_gain_factor(
          id(ikabot_gain_stt_0).state
        );

        id(ikabot_mic_stt_1).set_gain_factor(
          id(ikabot_gain_stt_1).state
        );

        id(ikabot_mic_wake).set_gain_factor(
          id(ikabot_gain_wake).state
        );

        id(va).set_noise_suppression_level(
          (uint8_t) id(ikabot_noise_suppression).state
        );

        id(va).set_auto_gain(
          (uint8_t) id(ikabot_auto_gain).state
        );

        id(va).set_volume_multiplier(
          id(ikabot_volume_multiplier).state
        );

        id(ikabot_etat).publish_state("Démarrage");

    - script.stop: voice_assistant_watchdog
    - script.stop: restaurer_freebox_apres_reponse

    - script.execute:
        id: ikabot_trace_event
        evenement: "PIPELINE DEMARRAGE"

    - logger.log:
        level: DEBUG
        format: "IKABOT : nouveau pipeline"

