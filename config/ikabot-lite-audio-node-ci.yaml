# CI-only configuration.
# Validates the Ikabot Lite audio-node overlay against the current public
# formatBCE ReSpeaker Lite package. No real credentials or local MP3 files.

packages:
  respeaker-satellite: github://formatBCE/Respeaker-Lite-ESPHome-integration/config/common/respeaker-satellite-base.yaml@main
  ikabot-audio-node:
    url: https://github.com/guillaumebianchin84/Respeakerikabot-XVF3800-ESPHome-integration
    ref: ikabot-integration
    refresh: 0s
    files:
      - packages/ikabot-lite-audio-node.yaml

esphome:
  name: ikabot-lite-ci
  friendly_name: Ikabot Lite CI

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret ikabot_lite_api_encryption_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ikabot_lite_ota_password

# The real Ikabot has these IDs mapped to local /config/esphome/sounds MP3s.
# CI uses one public sound repeatedly: we are validating the component graph,
# actions and lambdas, not the audio content.
audio_file:
  - id: activation_01
    file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
