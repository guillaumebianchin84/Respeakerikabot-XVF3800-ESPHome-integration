# Candidate Lite audio-only, preserve previous config/ikabot-lite-final.yaml
packages:
  ikabot-lite-base:
    url: https://github.com/guillaumebianchin84/Respeakerikabot-XVF3800-ESPHome-integration
    ref: ikabot-integration
    refresh: 0s
    files:
      - packages/ikabot-lite-audio-base-draft.yaml

  ikabot-audio-node:
    url: https://github.com/guillaumebianchin84/Respeakerikabot-XVF3800-ESPHome-integration
    ref: ikabot-integration
    refresh: 0s
    files:
      - packages/ikabot-lite-audio-node.yaml

esphome:
  name: ikabot
  friendly_name: ikabot

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret ikabot_api_encryption_key

ota:
  - platform: esphome
    password: !secret ikabot_ota_password

# Sons locaux conserves sur le Lite.
