name: Validate Ikabot ESPHome

concurrency:
  group: ikabot-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - ikabot-integration
  pull_request:
    branches:
      - main

jobs:
  validate-xvf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome 2026.9.0
        run: python -m pip install --upgrade pip "esphome==2026.9.0"

      - name: Create test secrets
        run: |
          cat > config/secrets.yaml <<'EOF'
          wifi_ssid: "TEST_WIFI"
          wifi_password: "TEST_PASSWORD_123456"
          ikabot_xvf_api_encryption_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          ikabot_xvf_ota_password: "TEST_OTA_PASSWORD"
          ikabot_lite_api_encryption_key: "YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODk="
          ikabot_lite_ota_password: "TEST_LITE_OTA_PASSWORD"
          EOF

      - name: Validate XVF configuration
        run: esphome config config/ikabot-xvf3800.yaml

      - name: Compile XVF firmware
        run: esphome compile config/ikabot-xvf3800.yaml

      - name: Validate ReSpeaker Lite audio-node overlay
        run: esphome config config/ikabot-lite-audio-node-ci.yaml

      - name: Compile ReSpeaker Lite audio-node overlay
        run: esphome compile config/ikabot-lite-audio-node-ci.yaml
