# KIMIA V6 COMPLETE SAFE - Hardware ESP32-S3 N16R8 external + XVF3800
# Copie dediee du materiel Ikabot ; aucune modification du materiel Ikabot.
# GPIO1 micro I2S verified with incoming 48 kHz audio; GPIO2 speaker output NOT verified yet.
# Source : https://github.com/guillaumebianchin84/Respeakerikabot-XVF3800-ESPHome-integration/blob/main/packages/hardware.yaml
#
# =============================================================================
# Respeaker XVF3800 satellite — hardware package
#
# Board-fixed configuration: I2S buses and pins, microphone, speaker chain,
# the XMOS XVF3800 DSP, and the TLV320AIC3104 codec.
#
# KIMIA Voice V6 (ESP32-S3 N16R8 externe) : les GPIO audio sont recables.
# Ne pas utiliser ces pins pour le XIAO d'origine ou pour Ikabot sans modification du cablage.
# =============================================================================

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
    # i2s_mclk_pin:
    #   number: GPIO9
    #   allow_other_uses: true

  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
    # i2s_mclk_pin:
    #   number: GPIO9
    #   allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: i2s_mics
    # KIMIA V6 : entree micro XVF3800; evite UART0 / CH343P (GPIO43).
    i2s_din_pin: GPIO1
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  # Hardware speaker output
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    # KIMIA V6 : sortie audio vers XVF3800; evite UART0 / CH343P (GPIO44).
    i2s_dout_pin: GPIO2
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: aic3104_dac

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # Virtual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false


respeaker_xvf3800:
  id: respeaker
  address: 0x2C
  mute_switch:
    id: mic_mute_switch
    name: "Microphone Mute"
    update_interval: 1s
    on_turn_on:
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - switch.is_on: mute_sound
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_on_sound"
    on_turn_off:
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - switch.is_on: mute_sound
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_off_sound"
  dfu_version:
    name: "Firmware Version"
    update_interval: 120s
  led_beam_sensor:
    name: "Voice Beam Direction"
    id: beam_direction
    internal: true
    # One non-blocking read per poll. The DSP answers CTRL_WAIT during silence;
    # the next poll is the retry, so keep this fast enough to track a speaker.
    # This poll is also the azimuth source for beam lock. Set update_interval to
    # never, and the Beam lock switch stops working.
    update_interval: 500ms
  # No firmware: section here. DFU is ALSO disabled in the KIMIA-specific C++ driver.
  # Never update the XMOS 1.0.9 through this ESP32 until separately approved.

audio_dac:
  - platform: aic3104
    id: aic3104_dac
    i2c_id: internal_i2c

number:
  # Gain on the ASR output. It always affects wake word; it affects STT only
  # when the route sends the ASR output to STT.
  - platform: template
    name: "ASR output gain"
    id: asr_out_gain
    optimistic: true
    restore_value: yes
    initial_value: 1.0
    min_value: 1.0
    max_value: 8.0
    step: 0.1
    entity_category: config
    icon: "mdi:microphone-message"
    on_value:
      - lambda: id(respeaker).set_asr_out_gain(x);
  # Maximum gain of the comms path's AGC. The comms output feeds STT on the
  # default route, so this raises STT there; it does not affect the ASR output.
  - platform: template
    name: "AGC max gain (comms)"
    id: agc_max_gain
    optimistic: true
    restore_value: yes
    initial_value: 32.0
    min_value: 1.0
    max_value: 125.0
    step: 1
    entity_category: config
    icon: "mdi:auto-fix"
    on_value:
      - lambda: id(respeaker).set_agc_max_gain(x);

select:
  # channel 0 -> STT, channel 1 -> micro_wake_word.
  - platform: template
    name: "DSP route"
    id: dsp_route
    optimistic: true
    restore_value: yes
    initial_option: "Comms to STT, ASR to wake word"
    entity_category: config
    icon: "mdi:call-split"
    options:
      - "ASR to STT and wake word"
      - "Comms to STT, ASR to wake word"
    on_value:
      - lambda: id(respeaker).set_asr_route(i == 0);
